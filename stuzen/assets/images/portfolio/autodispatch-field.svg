<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="autoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131d"/>
      <stop offset="50%" stop-color="#0e1d2c"/>
      <stop offset="100%" stop-color="#060e16"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="gpsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="autoCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142638" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1723" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="autoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>
    <filter id="dispatchShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#autoBg)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="150" cy="100" r="140" fill="#38bdf8" opacity="0.15" filter="blur(50px)"/>
  <circle cx="480" cy="240" r="130" fill="#f59e0b" opacity="0.13" filter="blur(45px)"/>

  <!-- Browser Window Chrome -->
  <g transform="translate(30, 24)" filter="url(#autoGlow)">
    <rect width="540" height="312" rx="12" fill="#0c1824" stroke="#1c334b" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect width="540" height="32" rx="12" fill="#122435"/>
    <rect y="20" width="540" height="12" fill="#122435"/>
    <!-- Controls -->
    <circle cx="20" cy="16" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="16" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="16" r="4.5" fill="#27c93f"/>
    <!-- URL Pill -->
    <rect x="80" y="8" width="265" height="16" rx="4" fill="#08101a"/>
    <text x="92" y="19.5" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500">https://dispatch.autofield.io/live-fleet</text>

    <!-- Status badge right -->
    <rect x="420" y="7" width="105" height="18" rx="9" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
    <circle cx="432" cy="16" r="3" fill="#f59e0b"/>
    <text x="441" y="19" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5">AI DISPATCH LIVE</text>
  </g>

  <!-- Inner Dispatch Layout -->
  <g transform="translate(45, 68)">
    <!-- Left Column: Live GPS Route Map & Fleet Tracker (width: 310) -->
    <g>
      <!-- Map Background Container -->
      <rect width="310" height="160" rx="8" fill="#08141f" stroke="#1c354e" stroke-width="1"/>
      
      <!-- GPS Road Grid Lines -->
      <path d="M 0 50 L 310 50 M 0 105 L 310 105 M 70 0 L 70 160 M 165 0 L 165 160 M 245 0 L 245 160" stroke="#11263a" stroke-width="6"/>
      <path d="M 0 50 L 310 50 M 0 105 L 310 105 M 70 0 L 70 160 M 165 0 L 165 160 M 245 0 L 245 160" stroke="#173550" stroke-width="1"/>

      <!-- Diagonal Arterial Highway -->
      <path d="M 30 160 L 165 50 L 290 0" stroke="#1d4060" stroke-width="8"/>
      <path d="M 30 160 L 165 50 L 290 0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>

      <!-- Active Service Route Path Glowing -->
      <path d="M 70 105 L 165 105 L 165 50 L 245 50" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 70 105 L 165 105 L 165 50 L 245 50" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.25"/>

      <!-- Origin Marker (Service Hub HQ) -->
      <circle cx="70" cy="105" r="7" fill="#0284c7"/>
      <circle cx="70" cy="105" r="3" fill="#ffffff"/>
      <rect x="42" y="117" width="56" height="15" rx="3" fill="#0a1826" stroke="#0284c7" stroke-width="1"/>
      <text x="70" y="127.5" text-anchor="middle" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700">SERVICE HUB</text>

      <!-- Active Technician Vehicle Icon on Route -->
      <g transform="translate(155, 68)">
        <circle cx="10" cy="10" r="14" fill="rgba(245, 158, 11, 0.25)"/>
        <circle cx="10" cy="10" r="8" fill="#f59e0b"/>
        <circle cx="10" cy="10" r="3.5" fill="#ffffff"/>
        <!-- Pulse radar -->
        <circle cx="10" cy="10" r="18" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
      </g>

      <!-- Destination Marker (Commercial Client Site) -->
      <g transform="translate(235, 40)">
        <polygon points="10,0 20,15 0,15" fill="#ef4444"/>
        <circle cx="10" cy="8" r="3" fill="#ffffff"/>
        <rect x="-10" y="18" width="52" height="15" rx="3" fill="#1c0e12" stroke="#ef4444" stroke-width="1"/>
        <text x="16" y="28.5" text-anchor="middle" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700">CLIENT SITE</text>
      </g>

      <!-- ETA Pill on Map -->
      <rect x="10" y="10" width="135" height="20" rx="4" fill="#06121c" stroke="#1e3a58" stroke-width="1"/>
      <circle cx="20" cy="20" r="3" fill="#22c55e"/>
      <text x="28" y="23.5" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">Van #07 En Route • ETA: 14m</text>

      <!-- Technician Bottom Quick Card -->
      <g transform="translate(0, 168)">
        <rect width="310" height="84" rx="8" fill="url(#autoCard)" stroke="#1c354e" stroke-width="1"/>
        <circle cx="28" cy="30" r="14" fill="#f59e0b"/>
        <text x="28" y="34" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800">DM</text>
        
        <text x="52" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">Dave Miller (Senior HVAC Tech)</text>
        <text x="52" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Vehicle: Ford Transit #07 • Distance: 4.2 miles</text>
        
        <rect x="14" y="52" width="135" height="20" rx="4" fill="rgba(34, 197, 94, 0.15)"/>
        <text x="81.5" y="65" text-anchor="middle" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">📍 80% Faster Response</text>

        <rect x="156" y="52" width="138" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)"/>
        <text x="225" y="65" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">⚡ 35% Route Fuel Saved</text>
      </g>
    </g>

    <!-- Right Column: AI Dispatch Priority & WhatsApp Ping (width: 185) -->
    <g transform="translate(325, 0)" filter="url(#dispatchShadow)">
      <!-- AI Dispatch Ticket Card -->
      <rect width="185" height="120" rx="8" fill="url(#autoCard)" stroke="#1c354e" stroke-width="1"/>
      <rect width="185" height="20" rx="8" fill="#193148"/>
      <rect y="12" width="185" height="8" fill="#193148"/>
      <text x="12" y="14" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">AI DISPATCH TICKET #4092</text>

      <text x="12" y="38" fill="#f87171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800">● PRIORITY: EMERGENCY</text>
      <text x="12" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Data Center HVAC Offline</text>
      <text x="12" y="64" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5">Server room temp rising (78°F)</text>
      <text x="12" y="76" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5">Auto-Assigned: Nearest Tech Van #07</text>

      <rect x="12" y="88" width="161" height="22" rx="4" fill="url(#amberGrad)"/>
      <text x="92.5" y="102" text-anchor="middle" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800">Auto-Dispatched in 0.4s</text>

      <!-- WhatsApp Live Verification Card -->
      <g transform="translate(0, 130)">
        <rect width="185" height="122" rx="8" fill="#0a1d17" stroke="#128c7e" stroke-width="1.2"/>
        <rect width="185" height="22" rx="8" fill="#128c7e"/>
        <rect y="12" width="185" height="10" fill="#128c7e"/>
        <circle cx="14" cy="11" r="5" fill="#ffffff"/>
        <text x="14" y="14" text-anchor="middle" fill="#128c7e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="900">📍</text>
        <text x="24" y="14" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">WhatsApp Live Geo-Pin</text>

        <!-- Message Body -->
        <text x="10" y="38" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">Technician Dispatched!</text>
        <text x="10" y="50" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5">Dave Miller is 4.2 miles away.</text>
        <text x="10" y="62" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5">Est. Arrival: 11:24 AM</text>
        
        <rect x="10" y="70" width="165" height="20" rx="3" fill="#13362a" stroke="#1b4d3c" stroke-width="1"/>
        <text x="16" y="83" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700">🔗 maps.stuzen.io/t/4092</text>

        <rect x="10" y="96" width="165" height="18" rx="3" fill="#10b981"/>
        <text x="92.5" y="108.5" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700">Open Live GPS Tracker →</text>
      </g>
    </g>
  </g>
</svg>
