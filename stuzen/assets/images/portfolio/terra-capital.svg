<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="terraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0c162c"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="terraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="terraBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="terraCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121f3d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b1428" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="terraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#terraBg)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.09" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="160" cy="90" r="130" fill="#2563eb" opacity="0.16" filter="blur(48px)"/>
  <circle cx="460" cy="240" r="140" fill="#d97706" opacity="0.12" filter="blur(50px)"/>

  <!-- Browser Window Chrome -->
  <g transform="translate(30, 24)" filter="url(#terraGlow)">
    <rect width="540" height="312" rx="12" fill="#0a1222" stroke="#1d2d50" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect width="540" height="32" rx="12" fill="#101c36"/>
    <rect y="20" width="540" height="12" fill="#101c36"/>
    <!-- Controls -->
    <circle cx="20" cy="16" r="4.5" fill="#ff5f56"/>
    <circle cx="34" cy="16" r="4.5" fill="#ffbd2e"/>
    <circle cx="48" cy="16" r="4.5" fill="#27c93f"/>
    <!-- URL Pill -->
    <rect x="80" y="8" width="260" height="16" rx="4" fill="#060b16"/>
    <text x="92" y="19.5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500">https://terracapital.vc/portal/fund-iii</text>

    <!-- Lighthouse 99 Score Badge -->
    <rect x="415" y="7" width="110" height="18" rx="9" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
    <circle cx="427" cy="16" r="4" fill="#22c55e"/>
    <text x="437" y="19.5" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800">LIGHTHOUSE 99/100</text>
  </g>

  <!-- Inner Portal Layout -->
  <g transform="translate(45, 68)">
    <!-- Top 2 Executive Metric Cards -->
    <g>
      <!-- Card 1: Total AUM & Active Fund -->
      <rect width="245" height="70" rx="8" fill="url(#terraCard)" stroke="#1d305a" stroke-width="1"/>
      <text x="14" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-transform="uppercase">Assets Under Management</text>
      <text x="14" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">$128.5M <tspan fill="#38bdf8" font-size="10" font-weight="700">USD</tspan></text>
      <rect x="14" y="50" width="105" height="13" rx="3" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="66.5" y="59.5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700">FUND III OVERSUBSCRIBED</text>

      <!-- Card 2: Net IRR & Returns -->
      <g transform="translate(260, 0)">
        <rect width="250" height="70" rx="8" fill="url(#terraCard)" stroke="#1d305a" stroke-width="1"/>
        <text x="14" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" text-transform="uppercase">Net Realized IRR</text>
        <text x="14" y="44" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900">34.2% <tspan fill="#4ade80" font-size="10" font-weight="bold">Top 5% Quartile</tspan></text>
        <rect x="14" y="50" width="95" height="13" rx="3" fill="rgba(245, 158, 11, 0.18)"/>
        <text x="61.5" y="59.5" text-anchor="middle" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="700">2.8x MOIC DISTRIBUTED</text>
      </g>
    </g>

    <!-- Bottom Section: Portfolio Companies & Allocation Matrix -->
    <g transform="translate(0, 82)">
      <!-- Left: Active Portfolio Companies (width: 300) -->
      <rect width="300" height="169" rx="8" fill="url(#terraCard)" stroke="#1d305a" stroke-width="1"/>
      <text x="14" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-transform="uppercase" letter-spacing="0.5">Active Fund III Portfolio Companies</text>

      <!-- Company 1 -->
      <g transform="translate(12, 30)">
        <rect width="276" height="38" rx="6" fill="#0a1326" stroke="#18284c" stroke-width="1"/>
        <circle cx="20" cy="19" r="11" fill="#2563eb"/>
        <text x="20" y="23" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">SX</text>
        <text x="38" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Synthetix AI Platform</text>
        <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Enterprise Agentic LLM • Series A</text>
        <rect x="205" y="11" width="60" height="16" rx="4" fill="rgba(56, 189, 248, 0.2)"/>
        <text x="235" y="22" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700">3.4x VALUE</text>
      </g>

      <!-- Company 2 -->
      <g transform="translate(12, 74)">
        <rect width="276" height="38" rx="6" fill="#0a1326" stroke="#18284c" stroke-width="1"/>
        <circle cx="20" cy="19" r="11" fill="#7c3aed"/>
        <text x="20" y="23" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">CP</text>
        <text x="38" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">CloudPulse DevOps</text>
        <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Zero-Trust Kubernetes Security • Seed</text>
        <rect x="205" y="11" width="60" height="16" rx="4" fill="rgba(167, 139, 250, 0.2)"/>
        <text x="235" y="22" text-anchor="middle" fill="#c4b5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700">2.8x VALUE</text>
      </g>

      <!-- Company 3 -->
      <g transform="translate(12, 118)">
        <rect width="276" height="38" rx="6" fill="#0a1326" stroke="#18284c" stroke-width="1"/>
        <circle cx="20" cy="19" r="11" fill="#059669"/>
        <text x="20" y="23" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">VH</text>
        <text x="38" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Veridian BioTech</text>
        <text x="38" y="29" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Genomic Sequence AI • Series B</text>
        <rect x="205" y="11" width="60" height="16" rx="4" fill="rgba(34, 197, 94, 0.2)"/>
        <text x="235" y="22" text-anchor="middle" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700">4.1x VALUE</text>
      </g>
    </g>

    <!-- Right: Sector Allocation & Encrypted LP Vault (width: 195) -->
    <g transform="translate(315, 82)">
      <rect width="195" height="169" rx="8" fill="url(#terraCard)" stroke="#1d305a" stroke-width="1"/>
      <text x="12" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" text-transform="uppercase">Sector Weighting</text>

      <!-- Sector Bar 1: AI Infrastructure -->
      <g transform="translate(12, 32)">
        <text x="0" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">AI &amp; Automation (42%)</text>
        <rect y="14" width="171" height="6" rx="3" fill="#1e293b"/>
        <rect y="14" width="72" height="6" rx="3" fill="url(#terraBlue)"/>
      </g>

      <!-- Sector Bar 2: Enterprise SaaS -->
      <g transform="translate(12, 60)">
        <text x="0" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Enterprise SaaS (35%)</text>
        <rect y="14" width="171" height="6" rx="3" fill="#1e293b"/>
        <rect y="14" width="60" height="6" rx="3" fill="#a855f7"/>
      </g>

      <!-- Sector Bar 3: FinTech & Web -->
      <g transform="translate(12, 88)">
        <text x="0" y="10" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">FinTech &amp; Cloud (23%)</text>
        <rect y="14" width="171" height="6" rx="3" fill="#1e293b"/>
        <rect y="14" width="39" height="6" rx="3" fill="url(#terraGold)"/>
      </g>

      <!-- Encrypted LP Vault Badge -->
      <g transform="translate(12, 118)">
        <rect width="171" height="40" rx="6" fill="#081020" stroke="#2563eb" stroke-width="1"/>
        <circle cx="18" cy="20" r="8" fill="#1e3a8a"/>
        <text x="18" y="24" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">🔒</text>
        <text x="32" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700">Encrypted LP Vault</text>
        <text x="32" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">256-bit Document Room</text>
      </g>
    </g>
  </g>
</svg>
