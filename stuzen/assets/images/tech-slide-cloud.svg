<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="dashCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="chartEmerald" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Glow Aura -->
  <circle cx="340" cy="210" r="180" fill="url(#cloudGlow)" filter="blur(45px)"/>

  <!-- Enterprise SaaS Platform Dashboard Frame -->
  <g filter="url(#cloudShadow)" transform="translate(60, 40)">
    <!-- Dashboard Canvas -->
    <rect x="0" y="0" width="460" height="295" rx="14" fill="url(#dashCard)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Dashboard Top Bar -->
    <rect x="0" y="0" width="460" height="42" rx="14" fill="#0f172a"/>
    <circle cx="20" cy="21" r="5" fill="#ef4444"/>
    <circle cx="36" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="21" r="5" fill="#10b981"/>
    <text x="75" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">STUZEN ENTERPRISE CLOUD // ERP</text>

    <!-- Top Status Pills -->
    <g transform="translate(320, 12)">
      <rect x="0" y="0" width="125" height="18" rx="9" fill="rgba(16, 185, 129, 0.2)"/>
      <circle cx="10" cy="9" r="3.5" fill="#10b981"/>
      <text x="20" y="13" fill="#34d399" font-family="sans-serif" font-size="8" font-weight="bold">Uptime 99.99%</text>
    </g>

    <!-- Sidebar Menu Mockup -->
    <g transform="translate(15, 55)">
      <rect x="0" y="0" width="90" height="225" rx="6" fill="#f1f5f9"/>
      <rect x="10" y="15" width="70" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="10" y="35" width="70" height="12" rx="3" fill="#0067b8"/>
      <rect x="10" y="55" width="70" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="10" y="75" width="70" height="12" rx="3" fill="#cbd5e1"/>
      <rect x="10" y="95" width="70" height="12" rx="3" fill="#cbd5e1"/>
    </g>

    <!-- Main Dashboard Analytics Cards -->
    <g transform="translate(120, 55)">
      <!-- Stat Card 1 -->
      <rect x="0" y="0" width="95" height="55" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="16" fill="#64748b" font-family="sans-serif" font-size="8">MONTHLY REVENUE</text>
      <text x="10" y="36" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">$184,520</text>
      <text x="10" y="48" fill="#10b981" font-family="sans-serif" font-size="8">▲ +28.4%</text>

      <!-- Stat Card 2 -->
      <rect x="110" y="0" width="95" height="55" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="16" fill="#64748b" font-family="sans-serif" font-size="8">AUTOMATED TASKS</text>
      <text x="10" y="36" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">42,890</text>
      <text x="10" y="48" fill="#0284c7" font-family="sans-serif" font-size="8">100% Synced</text>

      <!-- Stat Card 3 -->
      <rect x="220" y="0" width="105" height="55" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="16" fill="#64748b" font-family="sans-serif" font-size="8">SYSTEM SECURITY</text>
      <text x="10" y="36" fill="#10b981" font-family="sans-serif" font-size="13" font-weight="bold">AES-256</text>
      <text x="10" y="48" fill="#059669" font-family="sans-serif" font-size="8">Encrypted At Rest</text>

      <!-- Large Revenue & Microservice Chart -->
      <g transform="translate(0, 68)">
        <rect x="0" y="0" width="325" height="155" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="15" y="22" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">ERP Data Stream &amp; Pipeline Throughput</text>
        
        <!-- Bars -->
        <g transform="translate(15, 35)">
          <rect x="10" y="65" width="22" height="40" rx="3" fill="#e2e8f0"/>
          <rect x="45" y="45" width="22" height="60" rx="3" fill="#cbd5e1"/>
          <rect x="80" y="30" width="22" height="75" rx="3" fill="url(#chartEmerald)"/>
          <rect x="115" y="20" width="22" height="85" rx="3" fill="url(#chartEmerald)"/>
          <rect x="150" y="15" width="22" height="90" rx="3" fill="#0284c7"/>
          <rect x="185" y="5" width="22" height="100" rx="3" fill="#0067b8"/>
          <rect x="220" y="2" width="22" height="103" rx="3" fill="#10b981"/>
          
          <!-- Smooth Line Trend -->
          <path d="M 21 65 Q 60 35, 91 25 T 161 10 T 231 2" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Floating SLA & Security Shield Badge -->
  <g filter="url(#cloudShadow)" transform="translate(390, 290)">
    <rect x="0" y="0" width="170" height="50" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="25" cy="25" r="12" fill="#dcfce7"/>
    <text x="25" y="30" text-anchor="middle" fill="#059669" font-size="14">🛡️</text>
    <text x="46" y="20" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold">ENTERPRISE SLA</text>
    <text x="46" y="35" fill="#059669" font-family="sans-serif" font-size="9" font-weight="700">Zero Vendor Lock-in</text>
  </g>
</svg>