<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25d366" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0067b8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="waHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075e54"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#25d366"/>
    </linearGradient>
    <filter id="aiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#25d366" flood-opacity="0.25"/>
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ambient Glow Aura -->
  <circle cx="300" cy="210" r="190" fill="url(#aiGlow)" filter="blur(45px)"/>

  <!-- Neural Network Connections Lines -->
  <g opacity="0.25" stroke="#25d366" stroke-width="1.5">
    <line x1="120" y1="80" x2="220" y2="140"/>
    <line x1="220" y1="140" x2="350" y2="90"/>
    <line x1="350" y1="90" x2="480" y2="150"/>
    <line x1="220" y1="140" x2="280" y2="280"/>
    <line x1="280" y1="280" x2="440" y2="310"/>
    <line x1="350" y1="90" x2="440" y2="310"/>
  </g>
  <g fill="#25d366">
    <circle cx="120" cy="80" r="4"/>
    <circle cx="220" cy="140" r="5"/>
    <circle cx="350" cy="90" r="6"/>
    <circle cx="480" cy="150" r="4"/>
    <circle cx="280" cy="280" r="5"/>
    <circle cx="440" cy="310" r="5"/>
  </g>

  <!-- AI Holographic Neural Core Sphere -->
  <g transform="translate(100, 110)" filter="url(#aiShadow)">
    <circle cx="80" cy="80" r="65" fill="#0f172a" stroke="url(#neonPulse)" stroke-width="2.5"/>
    <circle cx="80" cy="80" r="45" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <circle cx="80" cy="80" r="25" fill="none" stroke="#25d366" stroke-width="2"/>
    <!-- Central AI Icon / Symbol -->
    <path d="M 68 80 L 92 80 M 80 68 L 80 92" stroke="#00f0ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="80" r="6" fill="#00f0ff"/>
    
    <text x="80" y="165" text-anchor="middle" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">AI NEURAL ENGINE</text>
    <text x="80" y="180" text-anchor="middle" fill="#059669" font-family="sans-serif" font-size="9" font-weight="600">Active Agent Model</text>
  </g>

  <!-- WhatsApp Smartphone Bot Interface (Center Right) -->
  <g filter="url(#boxShadow)" transform="translate(280, 45)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="240" height="330" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- WhatsApp App Header -->
    <rect x="0" y="0" width="240" height="55" rx="20" fill="url(#waHeader)"/>
    <!-- Avatar -->
    <circle cx="32" cy="28" r="14" fill="#ffffff"/>
    <text x="32" y="33" text-anchor="middle" fill="#075e54" font-family="sans-serif" font-size="12" font-weight="bold">⚡</text>
    
    <!-- Header Titles -->
    <text x="56" y="24" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Stuzen AI Assistant</text>
    <text x="56" y="37" fill="#a7f3d0" font-family="sans-serif" font-size="9">● Online &amp; Automated</text>

    <!-- Chat Messages Stream -->
    <g transform="translate(12, 68)">
      <!-- Message 1 (Bot) -->
      <rect x="0" y="0" width="175" height="42" rx="8" fill="#f1f5f9"/>
      <text x="8" y="16" fill="#1e293b" font-family="sans-serif" font-size="9">Hello! Welcome to Stuzen.</text>
      <text x="8" y="30" fill="#64748b" font-family="sans-serif" font-size="8.5">How can we assist your project?</text>

      <!-- Message 2 (User) -->
      <g transform="translate(38, 52)">
        <rect x="0" y="0" width="178" height="34" rx="8" fill="#dcf8c6"/>
        <text x="8" y="15" fill="#1e293b" font-family="sans-serif" font-size="9">Need WhatsApp lead intake</text>
        <text x="8" y="27" fill="#059669" font-family="sans-serif" font-size="8.5">with instant CRM webhook sync.</text>
      </g>

      <!-- Message 3 (Bot Automated Reply) -->
      <g transform="translate(0, 96)">
        <rect x="0" y="0" width="180" height="50" rx="8" fill="#f1f5f9"/>
        <text x="8" y="15" fill="#1e293b" font-family="sans-serif" font-size="9">Connecting webhook flow... ✓</text>
        <text x="8" y="29" fill="#0284c7" font-family="sans-serif" font-size="8.5">Lead #4082 logged to CRM.</text>
        <text x="8" y="42" fill="#10b981" font-family="sans-serif" font-size="8.5">Staff notified in 0.8s ⚡</text>
      </g>

      <!-- Quick Action Buttons -->
      <g transform="translate(0, 160)">
        <rect x="0" y="0" width="88" height="24" rx="12" fill="#eff6ff" stroke="#0067b8" stroke-width="1"/>
        <text x="44" y="15" text-anchor="middle" fill="#0067b8" font-family="sans-serif" font-size="8.5" font-weight="bold">View Demo</text>
        
        <rect x="96" y="0" width="94" height="24" rx="12" fill="#f0fdf4" stroke="#25d366" stroke-width="1"/>
        <text x="143" y="15" text-anchor="middle" fill="#15803d" font-family="sans-serif" font-size="8.5" font-weight="bold">Book Meeting</text>
      </g>
    </g>
  </g>

  <!-- Floating Telemetry Badge -->
  <g filter="url(#boxShadow)" transform="translate(50, 315)">
    <rect x="0" y="0" width="200" height="42" rx="8" fill="#ffffff" stroke="#25d366" stroke-width="1.5"/>
    <circle cx="20" cy="21" r="5" fill="#25d366"/>
    <text x="34" y="17" fill="#0f172a" font-family="sans-serif" font-size="9.5" font-weight="bold">WHATSAPP CLOUD API</text>
    <text x="34" y="31" fill="#475569" font-family="sans-serif" font-size="8.5">Sub-5-second lead response</text>
  </g>
</svg>